<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixNear - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #06152d,
                    #0b3b70,
                    #007bff,
                    #00bcd4
                );

            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }

        /* Animated background */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.5;
            animation: float 7s ease-in-out infinite;
        }

        .blob.one {
            width: 300px;
            height: 300px;
            background: #00e5ff;
            top: -100px;
            left: -100px;
        }

        .blob.two {
            width: 350px;
            height: 350px;
            background: #7c4dff;
            right: -120px;
            bottom: -120px;
            animation-delay: 2s;
        }

        .blob.three {
            width: 180px;
            height: 180px;
            background: #00ff88;
            right: 15%;
            top: 10%;
            animation-delay: 4s;
        }

        /* Login card */
        .login-container {
            position: relative;
            width: 90%;
            max-width: 410px;

            padding: 38px;

            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.3);

            color: white;

            animation: cardEnter 0.9s ease forwards;
        }

        /* Logo */
        .logo {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 1px;

            margin-bottom: 8px;

            animation: logoPop 1s ease;
        }

        .logo span {
            color: #7ee8ff;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.75);
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Inputs */
        .form-group {
            margin-bottom: 20px;
            animation: inputEnter 0.8s ease both;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.2s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.35s;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.7;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 45px;

            color: white;

            background: rgba(255,255,255,0.12);

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        input::placeholder {
            color: rgba(255,255,255,0.55);
        }

        input:focus {
            border-color: #6ee7ff;

            background: rgba(255,255,255,0.18);

            box-shadow:
                0 0 0 3px rgba(0, 225, 255, 0.12);

            transform: translateY(-2px);
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 14px;

            margin-top: 5px;

            border: none;
            border-radius: 12px;

            color: #06203d;

            background: linear-gradient(
                135deg,
                #ffffff,
                #8eeeff
            );

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            position: relative;
            overflow: hidden;

            transition: 0.3s;

            animation: buttonEnter 0.9s ease 0.5s both;
        }

        .login-btn::before {
            content: "";

            position: absolute;

            width: 0;
            height: 0;

            background: rgba(255,255,255,0.6);

            border-radius: 50%;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            transition: width 0.5s, height 0.5s;
        }

        .login-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0, 225, 255, 0.35);
        }

        .login-btn:hover::before {
            width: 350px;
            height: 350px;
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* Message */
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        /* Register */
        .register-link {
            text-align: center;
            margin-top: 25px;

            color: rgba(255,255,255,0.75);
            font-size: 14px;
        }

        .register-link a {
            color: #8eeeff;
            text-decoration: none;
            font-weight: 700;

            transition: 0.3s;
        }

        .register-link a:hover {
            color: white;
            text-shadow: 0 0 10px #8eeeff;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: rgba(255,255,255,0.65);

            text-decoration: none;

            font-size: 13px;

            transition: 0.3s;
        }

        .back-home:hover {
            color: white;
            transform: translateX(-3px);
        }

        /* Animations */

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -40px) scale(1.08);
            }
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(60px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes logoPop {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            70% {
                transform: scale(1.08);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes inputEnter {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes buttonEnter {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {

            .login-container {
                padding: 30px 22px;
            }

            .logo {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Animated background -->
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>


    <!-- Login Card -->
    <div class="login-container">

        <div class="logo">
            Fix<span>Near</span>
        </div>

        <p class="subtitle">
            Welcome back! Login to continue
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Password</label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

            </div>


            <button type="submit" class="login-btn">
                Login
            </button>

        </form>


        <div id="message" class="message"></div>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>


    <script>

        document
        .getElementById("loginForm")
        .addEventListener("submit", async function(e) {

            e.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            message.style.color = "#8eeeff";

            message.textContent =
                "Logging in...";

            try {

                const response = await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })

                });

                const data = await response.json();

                if (response.ok) {

                    message.style.color = "#00ff9d";

                    message.textContent =
                        "✓ Login successful!";

                    setTimeout(() => {

                        window.location.href =
                            "booking.html";

                    }, 1000);

                } else {

                    message.style.color = "#ff6b6b";

                    message.textContent =
                        data.message ||
                        "Invalid email or password.";

                }

            } catch (error) {

                console.error(error);

                message.style.color = "#ff6b6b";

                message.textContent =
                    "Server error. Please try again.";

            }

        });

    </script>

</body>
</html>
