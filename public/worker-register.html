<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join as Worker - FixNear</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 30px 15px;
            background:
                linear-gradient(
                    135deg,
                    #06152d,
                    #0b3b70,
                    #007bff,
                    #00bcd4
                );
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            color: white;
            overflow-x: hidden;
        }

        /* Floating Background */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.45;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        .blob.one {
            width: 280px;
            height: 280px;
            background: #00e5ff;
            top: -100px;
            left: -100px;
        }

        .blob.two {
            width: 350px;
            height: 350px;
            background: #7c4dff;
            right: -120px;
            bottom: -120px;
            animation-delay: 2s;
        }

        .blob.three {
            width: 170px;
            height: 170px;
            background: #00ff88;
            right: 15%;
            top: 8%;
            animation-delay: 4s;
        }

        /* Main Card */
        .worker-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 38px;

            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.3);

            animation: cardEnter 0.9s ease forwards;
        }

        /* Header */
        .logo {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: #7ee8ff;
        }

        .worker-title {
            text-align: center;
            margin-top: 8px;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.75);
            margin: 10px 0 30px;
            font-size: 14px;
        }

        .worker-icon {
            text-align: center;
            font-size: 48px;
            animation: iconFloat 3s ease-in-out infinite;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            animation: inputEnter 0.7s ease both;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;

            color: white;
            background: rgba(255,255,255,0.12);

            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 12px;

            outline: none;
            font-size: 15px;

            transition: 0.3s;
        }

        select option {
            color: #111;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255,255,255,0.55);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6ee7ff;

            background: rgba(255,255,255,0.18);

            box-shadow:
                0 0 0 3px rgba(0,225,255,0.12);

            transform: translateY(-2px);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 25px;

            border: none;
            border-radius: 13px;

            color: #06203d;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #8eeeff,
                    #00ff9d
                );

            background-size: 200% 200%;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.3s;

            animation:
                buttonEnter 0.9s ease 0.5s both,
                buttonGradient 4s ease infinite;
        }

        .submit-btn:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 30px rgba(0,225,255,0.35);
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        /* Login Link */
        .login-link {
            text-align: center;
            margin-top: 22px;

            color: rgba(255,255,255,0.75);
            font-size: 14px;
        }

        .login-link a {
            color: #8eeeff;
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            color: white;
            text-shadow: 0 0 10px #8eeeff;
        }

        /* Back */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;

            color: rgba(255,255,255,0.65);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: white;
        }

        /* Animations */

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -40px) scale(1.08);
            }
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(60px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes inputEnter {
            from {
                opacity: 0;
                transform: translateX(-25px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes buttonEnter {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes buttonGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Mobile */
        @media (max-width: 650px) {

            .worker-container {
                padding: 28px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .logo {
                font-size: 30px;
            }

            .worker-title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Animation -->
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>


    <!-- Worker Registration Card -->
    <div class="worker-container">

        <div class="worker-icon">
            🧑‍🔧
        </div>

        <div class="logo">
            Fix<span>Near</span>
        </div>

        <h1 class="worker-title">
            Join as a Worker
        </h1>

        <p class="subtitle">
            Work with FixNear and connect with customers near you
        </p>


        <form id="workerForm">

            <div class="form-grid">

                <!-- Name -->
                <div class="form-group">
                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <!-- Mobile -->
                <div class="form-group">
                    <label>Mobile Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your mobile number"
                        required
                    >
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <!-- Service -->
                <div class="form-group">
                    <label>Service / Skill</label>

                    <select id="service" required>
                        <option value="">Select your skill</option>
                        <option>Electrician</option>
                        <option>Plumber</option>
                        <option>Carpenter</option>
                        <option>AC Repair</option>
                        <option>Appliance Repair</option>
                        <option>Cleaning</option>
                        <option>Painter</option>
                        <option>Other</option>
                    </select>
                </div>


                <!-- Experience -->
                <div class="form-group">
                    <label>Experience</label>

                    <select id="experience" required>
                        <option value="">Select experience</option>
                        <option>Less than 1 year</option>
                        <option>1 - 2 years</option>
                        <option>3 - 5 years</option>
                        <option>5+ years</option>
                    </select>
                </div>


                <!-- Work Area -->
                <div class="form-group">
                    <label>Work Area</label>

                    <input
                        type="text"
                        id="area"
                        placeholder="City / Area"
                        required
                    >
                </div>


                <!-- Address -->
                <div class="form-group full">
                    <label>Address</label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your complete address"
                        required
                    >
                </div>


                <!-- About -->
                <div class="form-group full">
                    <label>About Your Work</label>

                    <textarea
                        id="about"
                        placeholder="Tell us about your skills and work experience..."
                        required
                    ></textarea>
                </div>

            </div>


            <button type="submit" class="submit-btn">
                🚀 Apply as a Worker
            </button>

        </form>


        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

    </div>


    <script>

        document
            .getElementById("workerForm")
            .addEventListener("submit", function(e) {

                e.preventDefault();

                alert(
                    "Worker application form is ready! Backend connection will be added next."
                );

            });

    </script>

</body>

</html>
