<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed - FixNear</title>

    <style>
        /* =====================================================
           FIXNEAR - BOOKING SUCCESS PAGE
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1677ff;
            --primary-dark: #075dcc;
            --purple: #684dff;
            --green: #16a05a;
            --text: #172033;
            --muted: #667085;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            font-family: Arial, sans-serif;

            color: var(--text);

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(22, 119, 255, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(104, 77, 255, 0.14),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #edf5ff,
                    #f8faff 50%,
                    #f3f0ff
                );
        }


        /* =====================================================
           ANIMATED BACKGROUND
           ===================================================== */

        body::before {
            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            top: -120px;
            left: -100px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(22, 119, 255, 0.20),
                    rgba(104, 77, 255, 0.08)
                );

            filter: blur(8px);

            animation: orbOne 8s ease-in-out infinite;

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            right: -130px;
            bottom: -150px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(104, 77, 255, 0.18),
                    rgba(22, 119, 255, 0.08)
                );

            filter: blur(10px);

            animation: orbTwo 10s ease-in-out infinite;

            pointer-events: none;
        }

        @keyframes orbOne {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(45px, 55px) scale(1.15);
            }
        }

        @keyframes orbTwo {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-50px, -40px) scale(1.12);
            }
        }


        /* =====================================================
           SUCCESS CARD
           ===================================================== */

        .success-card {
            width: 100%;
            max-width: 560px;

            position: relative;
            z-index: 5;

            padding: 45px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.92);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 28px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 35px 90px rgba(25, 45, 85, 0.16),
                0 10px 30px rgba(22, 119, 255, 0.08);

            overflow: hidden;

            animation:
                cardEnter 0.9s cubic-bezier(.2, .8, .2, 1) both;
        }

        /* Animated top border */

        .success-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--purple),
                    var(--primary)
                );

            background-size: 200% 100%;

            animation: gradientMove 3s linear infinite;
        }

        /* Sparkle */

        .success-card::after {
            content: "✦";

            position: absolute;

            top: 25px;
            right: 30px;

            color: rgba(22, 119, 255, 0.30);

            font-size: 25px;

            animation: sparkle 2.5s ease-in-out infinite;
        }

        @keyframes cardEnter {

            from {
                opacity: 0;
                transform:
                    translateY(60px)
                    scale(0.90);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(1) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.3) rotate(20deg);
            }
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo {
            font-size: 30px;

            font-weight: 800;

            letter-spacing: -1px;

            margin-bottom: 28px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--purple)
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: logoEnter 0.8s 0.2s ease both;
        }

        @keyframes logoEnter {

            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           SUCCESS CHECK
           ===================================================== */

        .check {
            width: 92px;
            height: 92px;

            margin: 0 auto 26px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #eafff2,
                    #dcf8e9
                );

            color: var(--green);

            font-size: 52px;

            font-weight: bold;

            box-shadow:
                0 0 0 12px rgba(32, 160, 90, 0.05),
                0 15px 35px rgba(32, 160, 90, 0.16);

            animation:
                checkPop 0.8s 0.35s cubic-bezier(.2, 1.5, .4, 1) both,
                checkFloat 3s 1.2s ease-in-out infinite;
        }

        @keyframes checkPop {

            0% {
                opacity: 0;
                transform: scale(0) rotate(-30deg);
            }

            65% {
                transform: scale(1.15) rotate(8deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes checkFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }


        /* =====================================================
           HEADING
           ===================================================== */

        h1 {
            margin: 0 0 12px;

            color: #101828;

            font-size: 36px;

            line-height: 1.2;

            letter-spacing: -1px;

            animation:
                textReveal 0.7s 0.55s ease both;
        }

        @keyframes textReveal {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .message {
            max-width: 450px;

            margin: 0 auto;

            color: var(--muted);

            font-size: 16px;

            line-height: 1.7;

            animation:
                textReveal 0.7s 0.65s ease both;
        }


        /* =====================================================
           BOOKING ID
           ===================================================== */

        .booking-id {
            width: 100%;

            margin: 25px 0 15px;

            padding: 18px;

            background:
                linear-gradient(
                    135deg,
                    #f1f6ff,
                    #f7f4ff
                );

            border: 1px solid rgba(22, 119, 255, 0.10);

            border-radius: 15px;

            text-align: center;

            overflow: hidden;

            animation:
                boxReveal 0.7s 0.75s ease both;
        }

        .booking-id-label {
            display: block;

            margin-bottom: 8px;

            color: #667085;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1.2px;
        }

        #bookingId {
            display: block;

            width: 100%;

            color: var(--primary);

            font-size: 14px;

            font-weight: bold;

            line-height: 1.6;

            overflow-wrap: anywhere;

            word-break: break-all;
        }

        @keyframes boxReveal {

            from {
                opacity: 0;
                transform:
                    translateY(20px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           BOOKING INFORMATION
           ===================================================== */

        .booking-info {
            width: 100%;

            margin: 15px 0 27px;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f5f8ff,
                    #faf8ff
                );

            border: 1px solid rgba(22, 119, 255, 0.08);

            border-radius: 16px;

            animation:
                boxReveal 0.7s 0.85s ease both;
        }

        .booking-info p {
            margin: 9px 0;

            color: #344054;

            font-size: 15px;

            line-height: 1.6;
        }

        .booking-info strong {
            color: var(--primary);
        }


        /* =====================================================
           HOME BUTTON
           ===================================================== */

        .home-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            min-height: 50px;

            padding: 14px 25px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            border-radius: 11px;

            box-shadow:
                0 10px 25px rgba(22, 119, 255, 0.25);

            position: relative;

            overflow: hidden;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            animation:
                buttonReveal 0.7s 0.95s ease both;
        }

        /* Button shine */

        .home-btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.45),
                    transparent
                );

            transform: skewX(-25deg);

            transition: 0.6s;
        }

        .home-btn:hover::before {
            left: 140%;
        }

        .home-btn:hover {
            transform: translateY(-4px);

            box-shadow:
                0 18px 38px rgba(22, 119, 255, 0.32);
        }

        .home-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        @keyframes buttonReveal {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer-text {
            margin-top: 25px;

            color: #7a8496;

            font-size: 13px;

            animation:
                fadeIn 1s 1.1s ease both;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =====================================================
           MOBILE RESPONSIVE
           ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px 14px;
            }

            .success-card {
                padding: 38px 20px;

                border-radius: 23px;
            }

            .logo {
                font-size: 26px;
            }

            .check {
                width: 78px;
                height: 78px;

                font-size: 43px;
            }

            h1 {
                font-size: 29px;
            }

            .message {
                font-size: 15px;
            }

            .booking-id {
                padding: 15px 12px;
            }

            #bookingId {
                font-size: 12px;
            }

            .booking-info {
                padding: 16px 12px;
            }

            .home-btn {
                width: 100%;
            }
        }


        /* =====================================================
           ACCESSIBILITY
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>


<body>

    <div class="success-card">

        <!-- LOGO -->
        <div class="logo">
            FixNear
        </div>


        <!-- SUCCESS ICON -->
        <div class="check">
            ✓
        </div>


        <!-- HEADING -->
        <h1>
            Booking Confirmed!
        </h1>


        <!-- MESSAGE -->
        <p class="message">
            Your service booking has been successfully received.
            Our service team will contact you shortly.
        </p>


        <!-- BOOKING ID -->
        <div class="booking-id">

            <span class="booking-id-label">
                Your Booking ID
            </span>

            <span id="bookingId">
                Loading...
            </span>

        </div>


        <!-- BOOKING INFORMATION -->
        <div class="booking-info">

            <p>
                <strong>Status:</strong>
                Booking Received
            </p>

            <p>
                <strong>Service:</strong>
                Your requested service
            </p>

        </div>


        <!-- HOME BUTTON -->
        <a href="/" class="home-btn">
            🏠 Back to Home
        </a>


        <!-- FOOTER -->
        <p class="footer-text">
            Thank you for choosing FixNear ❤️
        </p>

    </div>


    <script>

        /* =====================================================
           GET BOOKING ID FROM URL
           ===================================================== */

        const params =
            new URLSearchParams(window.location.search);

        const bookingId =
            params.get("id");

        const bookingIdElement =
            document.getElementById("bookingId");


        if (bookingId) {

            bookingIdElement.textContent =
                bookingId;

        } else {

            bookingIdElement.textContent =
                "Booking ID unavailable";

        }

    </script>

</body>

</html>
